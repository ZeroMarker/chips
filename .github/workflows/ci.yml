name: CI

# Gates every change with formatting, lints, tests, and — most importantly — real
# runs of the model. `riscv-smoke` is the end-to-end check that the
# Clippy-and-unit-tests jobs cannot give: compiler-produced RV32IM encodings
# executed by the golden model. `riscv-tests` goes further and runs the official
# conformance suites.
#
# What CI still cannot check is the ROADMAP P3 acceptance criterion proper:
# comparing the model against a hardware RTL peer, with Spike as an external
# reference. No Spike, QEMU, Verilator, or RTL exists yet; see docs/TODO.md.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same ref are wasted minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A warning anywhere is a failure, including the `unsafe_code = "forbid"`
  # invariant declared in Cargo.toml.
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format, lints, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken platform should not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The model is portable safe `std` Rust, so the same assertions must hold
      # on every platform — including the driver tests in tests/cli.rs, which
      # write an image to a temporary file and execute the real binary.
      - name: Test (debug, overflow checks on)
        run: cargo test --all-targets

      # Arithmetically the model relies on wrapping operations, so the release
      # profile (overflow checks off) must produce identical results.
      - name: Test (release)
        run: cargo test --release --all-targets

  riscv-smoke:
    name: RISC-V toolchain smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Provides riscv64-unknown-elf-gcc and -objcopy. The toolchain is named
      # riscv64-* even though the smoke program targets rv32im.
      - name: Install the RISC-V cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-riscv64-unknown-elf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # --require turns a missing toolchain into a failure: this job exists to
      # run the real thing, so silently skipping would defeat it. Invoked through
      # bash so a checkout without the executable bit still works.
      - name: Assemble scripts/smoke.S and run it on the model
        run: bash scripts/riscv-smoke.sh --require

  riscv-tests:
    name: riscv-tests conformance suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The same cross toolchain as riscv-smoke. riscv-tests additionally needs
      # these to run its autoconf configure step.
      - name: Install the RISC-V cross toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-riscv64-unknown-elf \
            autoconf automake libmpc-dev libgmp-dev texinfo device-tree-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # This is the ROADMAP P0/P1 acceptance criterion: the official rv32ui and
      # rv32mi suites running on the model, reporting through the tohost
      # convention. Two tests are reported as excluded rather than passed,
      # because they need facilities the model does not implement (the debug
      # trigger module and PMP); the script names them and fails on anything
      # else, so a real regression cannot hide behind them.
      - name: Build and run rv32ui-p-* and rv32mi-p-*
        run: bash scripts/riscv-tests.sh --require
